name: Build Windows calculator EXE

on:
  push:
    branches: [main]
    paths:
      - "calc-desktop/**"
      - ".github/workflows/calc-desktop.yml"
  pull_request:
    paths:
      - "calc-desktop/**"
      - ".github/workflows/calc-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calc-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone EXE
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name calc-chatgpt-20261014
          --distpath dist
          calc-desktop/main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = "dist/calc-chatgpt-20261014.exe"
          if (-not (Test-Path $exe)) {
            throw "Build output not found: $exe"
          }
          $item = Get-Item $exe
          if ($item.Length -lt 100000) {
            throw "EXE unexpectedly small ($($item.Length) bytes)"
          }
          "EXE: $($item.FullName)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Size: $($item.Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: calc-chatgpt-20261014-windows-x64
          path: dist/calc-chatgpt-20261014.exe
          if-no-files-found: error
          retention-days: 14
