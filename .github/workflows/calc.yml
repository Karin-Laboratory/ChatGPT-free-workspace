name: calc - test and build

on:
  push:
    branches: [main]
    paths:
      - "calc/**"
      - ".github/workflows/calc.yml"
  pull_request:
    paths:
      - "calc/**"
      - ".github/workflows/calc.yml"
  workflow_dispatch:

concurrency:
  group: calc-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: calc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calc/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
