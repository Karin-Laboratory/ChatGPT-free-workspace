name: apps - test, build and deploy

# 直下に wrangler.jsonc を持つフォルダ = 1アプリ。
# main への push では「変更のあったアプリ」だけを検証して公開する。
# プルリクエストでは検証 (テスト・ビルド) のみ。公開はしない。
# 手動実行 (Run workflow) では、アプリ名を空白区切りで指定するか、空欄で全アプリを公開する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apps:
        description: "公開するアプリ名 (空白区切り)。空欄なら全アプリ"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          set -f
          case "$EVENT" in
            pull_request)
              apps=$(scripts/detect-apps.sh "$BASE_SHA" "$HEAD_SHA") ;;
            workflow_dispatch)
              all=$(scripts/detect-apps.sh all)
              if [ -z "${INPUT_APPS// /}" ]; then
                apps="$all"
              else
                apps="[]"
                for a in $INPUT_APPS; do
                  echo "$all" | jq -e --arg a "$a" 'index($a)' >/dev/null \
                    || { echo "::error::アプリ '$a' が見つかりません (対象: $all)"; exit 1; }
                  apps=$(echo "$apps" | jq -c --arg a "$a" '. + [$a]')
                done
              fi ;;
            *)
              apps=$(scripts/detect-apps.sh "$BEFORE" "$HEAD_SHA") ;;
          esac
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "対象アプリ: \`$apps\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 公開ルールの検証
        env:
          APP: ${{ matrix.app }}
        run: scripts/validate-app.sh "$APP"

      - name: テストとビルド
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test --if-present
            npm run build --if-present
          else
            echo "package.json なし: 静的アプリとしてそのまま公開します"
          fi

      - name: Cloudflare Workers へ公開
        if: github.event_name != 'pull_request'
        working-directory: ${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Actions シークレット CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未登録です (README の初回セットアップ参照)。公開は行われていません。"
            exit 1
          fi
          npx --yes wrangler@4 deploy

      - name: 公開URLの動作確認
        if: github.event_name != 'pull_request'
        env:
          APP: ${{ matrix.app }}
        run: |
          url="https://${APP}-claude.karin-lab.com/"
          # 初回はカスタムドメインの DNS・証明書の反映に時間がかかることがあるため再試行する
          code=$(curl -sS -L -m 30 --retry 12 --retry-delay 10 --retry-all-errors \
                 -o body.html -w '%{http_code}' "$url") || code="error"
          size=$(wc -c < body.html 2>/dev/null || echo 0)
          {
            echo "### $APP"
            echo "- URL: $url"
            echo "- HTTP: $code / 本文 ${size} bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ] || [ "$size" -eq 0 ]; then
            echo "::error::$url が 200 を返しません (HTTP $code)"
            exit 1
          fi
